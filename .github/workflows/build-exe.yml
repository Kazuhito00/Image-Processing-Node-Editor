name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [created]

jobs:
  build-windows-exe:
    runs-on: windows-latest

    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    permissions:
      contents: write
      actions: read

    steps:
    # 1️⃣ Récupération du code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Setup Python 3.10
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3️⃣ Installer outils de build
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel

    # 4️⃣ Installer les dépendances de build d'abord
    - name: Install build dependencies first
      run: |
        pip install numpy>=1.21.0
    
    # 5️⃣ Installer toutes les dépendances
    # Une commande par étape : PowerShell ne remonte que le code de sortie de
    # la dernière commande, un échec de la première passait donc inaperçu.
    - name: Install dependencies
      run: pip install --no-build-isolation -r requirements.txt

    - name: Install build requirements
      run: pip install -r requirements-build.txt

    # Les modules indispensables au démarrage doivent être importables
    - name: Check core modules
      run: python -c "import numpy, cv2, dearpygui.dearpygui, onnxruntime, sounddevice; print('core modules OK')"

    # 5.5️⃣ Vérifier que toutes les dépendances sont installées
    - name: Verify dependencies
      run: |
        python verify_dependencies.py

    # 6️⃣ Construire l'exécutable avec build_exe.py (nettoie et construit)
    - name: Build executable with build_exe.py
      run: |
        python build_exe.py --clean --skip-package-check

    # 7️⃣ Vérifier le build et afficher les tailles
    - name: Verify build
      run: |
        if (Test-Path "dist/CV_Studio/CV_Studio.exe") {
          Write-Host "✓ CV_Studio.exe created successfully"
          $exeSize = (Get-Item "dist/CV_Studio/CV_Studio.exe").Length
          Write-Host ("Executable size: {0:N2} MB" -f ($exeSize / 1MB))
          $totalSize = (Get-ChildItem dist/CV_Studio -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host ("Total folder size: {0:N2} MB" -f ($totalSize / 1MB))
          Write-Host ("Total files: {0}" -f (Get-ChildItem dist/CV_Studio -Recurse -File).Count)
          
          # Vérifier que les fichiers critiques sont présents
          $criticalFiles = @(
            "dist/CV_Studio/_internal",
            "dist/CV_Studio/_internal/cv2",
            "dist/CV_Studio/_internal/dearpygui",
            "dist/CV_Studio/_internal/onnxruntime",
            "dist/CV_Studio/node",
            "dist/CV_Studio/node_editor"
          )
          $missingFiles = @()
          foreach ($file in $criticalFiles) {
            if (-not (Test-Path $file)) {
              $missingFiles += $file
            }
          }
          if ($missingFiles.Count -gt 0) {
            Write-Error "Missing critical files/directories: $($missingFiles -join ', ')"
            exit 1
          }
          Write-Host "✓ All critical files and directories present"
        } else {
          Write-Error "Build failed - CV_Studio.exe not found"
          exit 1
        }

    # 8️⃣ Créer l’archive zip
    - name: Create archive
      run: |
        Compress-Archive -Path dist/CV_Studio -DestinationPath CV_Studio-Windows.zip

    # 9️⃣ Upload de l’artefact pour le workflow
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CV_Studio-Windows-Executable
        path: CV_Studio-Windows.zip
        retention-days: 30

    # 🔟 Upload sur la release si déclenché par une release
    - name: Upload to release (if triggered by release)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: CV_Studio-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
